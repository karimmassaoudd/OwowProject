# 1. Make sure you're on the correct branch
git checkout karimmmassaoudd_Pixel-Weather-Mode

# 2. Navigate to the owowapp directory
cd owowapp

# 3. Delete the old lockfile
rm pnpm-lock.yaml

# 4.  Regenerate the lockfile
pnpm install

# 5. Go back to root and commit
cd ..
git add owowapp/pnpm-lock. yaml
git commit -m "chore: update pnpm-lock.yaml"
git push origin karimmmassaoudd_Pixel-Weather-Mode
